name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Vite build
        run: npm run build

      - name: Prepare static site
        run: |
          rm -rf site
          mkdir -p site
          cp ./*.html site/
          cp ./styles.css ./main.js site/
          cp -r ./assets site/assets

      - name: Verify deployed files
        run: |
          test -f site/index.html
          test -f site/styles.css
          test -f site/main.js
          test -f site/assets/original_logo.png
          test -f site/assets/hero_background.webp
          for page in about branches breakdowns cabins contact factory installation maintenance modernization parts projects; do
            test -f "site/$page.html"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
